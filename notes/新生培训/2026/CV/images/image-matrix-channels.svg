<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">彩色图像的矩阵与 RGB 通道结构</title>
  <desc id="desc">展示一张 H 乘 W 的彩色图像如何表示为 H 乘 W 乘 3 的数组，以及一个像素的 RGB 值和三个通道。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif !important; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#background)"/>
  <text x="600" y="54" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#172554">Color image = spatially organized numbers</text>
  <text x="600" y="86" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#64748b">Each pixel contains three values: red, green and blue</text>

  <g filter="url(#shadow)">
    <rect x="76" y="135" width="360" height="340" rx="18" fill="#ffffff"/>
  </g>
  <text x="256" y="158" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Image plane: H × W</text>

  <g stroke="#ffffff" stroke-width="3">
    <rect x="118" y="198" width="55" height="55" fill="#354f76"/>
    <rect x="173" y="198" width="55" height="55" fill="#536b8d"/>
    <rect x="228" y="198" width="55" height="55" fill="#b36b55"/>
    <rect x="283" y="198" width="55" height="55" fill="#d19573"/>
    <rect x="338" y="198" width="55" height="55" fill="#f0c3a2"/>
    <rect x="118" y="253" width="55" height="55" fill="#416c78"/>
    <rect x="173" y="253" width="55" height="55" fill="#629495"/>
    <rect x="228" y="253" width="55" height="55" fill="#e65b43" stroke="#facc15" stroke-width="6"/>
    <rect x="283" y="253" width="55" height="55" fill="#dd8464"/>
    <rect x="338" y="253" width="55" height="55" fill="#ebba93"/>
    <rect x="118" y="308" width="55" height="55" fill="#29434d"/>
    <rect x="173" y="308" width="55" height="55" fill="#667b68"/>
    <rect x="228" y="308" width="55" height="55" fill="#b98d60"/>
    <rect x="283" y="308" width="55" height="55" fill="#d7a56c"/>
    <rect x="338" y="308" width="55" height="55" fill="#edd19e"/>
    <rect x="118" y="363" width="55" height="55" fill="#172b3d"/>
    <rect x="173" y="363" width="55" height="55" fill="#344d5f"/>
    <rect x="228" y="363" width="55" height="55" fill="#8d6658"/>
    <rect x="283" y="363" width="55" height="55" fill="#b38773"/>
    <rect x="338" y="363" width="55" height="55" fill="#d7ad91"/>
  </g>

  <line x1="118" y1="184" x2="393" y2="184" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">W (columns)</text>
  <line x1="102" y1="198" x2="102" y2="418" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="88" y="311" text-anchor="middle" transform="rotate(-90 88 311)" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">H (rows)</text>
  <text x="256" y="447" text-anchor="middle" font-family="monospace" font-size="17" fill="#334155">image[y, x] = [230, 91, 67]</text>

  <path d="M 449 305 C 500 305, 525 305, 571 305" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="287" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#475569">Split channels</text>

  <g filter="url(#shadow)">
    <rect x="590" y="135" width="540" height="340" rx="18" fill="#ffffff"/>
  </g>
  <text x="860" y="169" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Three channels: each is an H × W matrix</text>

  <g transform="translate(628 212)">
    <rect width="135" height="165" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="3"/>
    <g stroke="#ffffff" stroke-width="2">
      <rect x="18" y="26" width="33" height="33" fill="#fecdd3"/><rect x="51" y="26" width="33" height="33" fill="#fb7185"/><rect x="84" y="26" width="33" height="33" fill="#e11d48"/>
      <rect x="18" y="59" width="33" height="33" fill="#fda4af"/><rect x="51" y="59" width="33" height="33" fill="#be123c"/><rect x="84" y="59" width="33" height="33" fill="#881337"/>
      <rect x="18" y="92" width="33" height="33" fill="#ffe4e6"/><rect x="51" y="92" width="33" height="33" fill="#fb7185"/><rect x="84" y="92" width="33" height="33" fill="#9f1239"/>
    </g>
    <text x="67" y="149" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#be123c">R channel</text>
  </g>

  <text x="782" y="305" font-family="sans-serif" font-size="31" font-weight="700" fill="#94a3b8">+</text>

  <g transform="translate(815 212)">
    <rect width="135" height="165" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
    <g stroke="#ffffff" stroke-width="2">
      <rect x="18" y="26" width="33" height="33" fill="#dcfce7"/><rect x="51" y="26" width="33" height="33" fill="#86efac"/><rect x="84" y="26" width="33" height="33" fill="#16a34a"/>
      <rect x="18" y="59" width="33" height="33" fill="#bbf7d0"/><rect x="51" y="59" width="33" height="33" fill="#15803d"/><rect x="84" y="59" width="33" height="33" fill="#14532d"/>
      <rect x="18" y="92" width="33" height="33" fill="#f0fdf4"/><rect x="51" y="92" width="33" height="33" fill="#4ade80"/><rect x="84" y="92" width="33" height="33" fill="#166534"/>
    </g>
    <text x="67" y="149" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#15803d">G channel</text>
  </g>

  <text x="969" y="305" font-family="sans-serif" font-size="31" font-weight="700" fill="#94a3b8">+</text>

  <g transform="translate(1002 212)">
    <rect width="95" height="165" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <g stroke="#ffffff" stroke-width="2">
      <rect x="14" y="26" width="22" height="33" fill="#dbeafe"/><rect x="36" y="26" width="22" height="33" fill="#60a5fa"/><rect x="58" y="26" width="22" height="33" fill="#2563eb"/>
      <rect x="14" y="59" width="22" height="33" fill="#93c5fd"/><rect x="36" y="59" width="22" height="33" fill="#1d4ed8"/><rect x="58" y="59" width="22" height="33" fill="#1e3a8a"/>
      <rect x="14" y="92" width="22" height="33" fill="#eff6ff"/><rect x="36" y="92" width="22" height="33" fill="#3b82f6"/><rect x="58" y="92" width="22" height="33" fill="#1e40af"/>
    </g>
    <text x="47" y="149" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">B</text>
  </g>

  <g transform="translate(205 530)">
    <rect width="340" height="70" rx="16" fill="#172554"/>
    <text x="170" y="29" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#bfdbfe">NumPy array shape</text>
    <text x="170" y="54" text-anchor="middle" font-family="monospace" font-size="23" font-weight="700" fill="#ffffff">shape = (H, W, 3)</text>
  </g>
  <g transform="translate(655 530)">
    <rect width="340" height="70" rx="16" fill="#172554"/>
    <text x="170" y="29" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#bfdbfe">Coordinates and array indexing</text>
    <text x="170" y="54" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#ffffff">pixel(x,y) → image[y,x]</text>
  </g>
</svg>
