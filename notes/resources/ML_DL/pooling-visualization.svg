<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">最大池化与平均池化的可视化示例</title>
  <desc id="desc">一个四乘四特征图按照二乘二窗口分成四块。最大池化从每块选出最大值，平均池化计算每块的平均值，二者都得到二乘二输出特征图。</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1100" height="520" rx="24" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#172554">池化层：用一个数概括一小块区域</text>

  <g filter="url(#shadow)">
    <rect x="65" y="102" width="304" height="304" rx="15" fill="#ffffff"/>
    <rect x="73" y="110" width="72" height="72" fill="#dbeafe" stroke="#ffffff" stroke-width="3"/>
    <text x="109" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">1</text>
    <rect x="145" y="110" width="72" height="72" fill="#dbeafe" stroke="#ffffff" stroke-width="3"/>
    <text x="181" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">3</text>
    <rect x="217" y="110" width="72" height="72" fill="#ffedd5" stroke="#ffffff" stroke-width="3"/>
    <text x="253" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">2</text>
    <rect x="289" y="110" width="72" height="72" fill="#ffedd5" stroke="#ffffff" stroke-width="3"/>
    <text x="325" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">4</text>
    <rect x="73" y="182" width="72" height="72" fill="#dbeafe" stroke="#ffffff" stroke-width="3"/>
    <text x="109" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">5</text>
    <rect x="145" y="182" width="72" height="72" fill="#dbeafe" stroke="#ffffff" stroke-width="3"/>
    <text x="181" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">6</text>
    <rect x="217" y="182" width="72" height="72" fill="#ffedd5" stroke="#ffffff" stroke-width="3"/>
    <text x="253" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">1</text>
    <rect x="289" y="182" width="72" height="72" fill="#ffedd5" stroke="#ffffff" stroke-width="3"/>
    <text x="325" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">2</text>
    <rect x="73" y="254" width="72" height="72" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/>
    <text x="109" y="298" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">7</text>
    <rect x="145" y="254" width="72" height="72" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/>
    <text x="181" y="298" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">2</text>
    <rect x="217" y="254" width="72" height="72" fill="#f3e8ff" stroke="#ffffff" stroke-width="3"/>
    <text x="253" y="298" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">8</text>
    <rect x="289" y="254" width="72" height="72" fill="#f3e8ff" stroke="#ffffff" stroke-width="3"/>
    <text x="325" y="298" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">3</text>
    <rect x="73" y="326" width="72" height="72" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/>
    <text x="109" y="370" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">1</text>
    <rect x="145" y="326" width="72" height="72" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/>
    <text x="181" y="370" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">4</text>
    <rect x="217" y="326" width="72" height="72" fill="#f3e8ff" stroke="#ffffff" stroke-width="3"/>
    <text x="253" y="370" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">2</text>
    <rect x="289" y="326" width="72" height="72" fill="#f3e8ff" stroke="#ffffff" stroke-width="3"/>
    <text x="325" y="370" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24.48" font-weight="700" fill="#172554">9</text>

  </g>
  <path d="M217 110 V398 M73 254 H361" fill="none" stroke="#475569" stroke-width="5"/>
  <text x="217" y="444" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#334155">输入特征图 4 × 4</text>
  <text x="217" y="474" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">2 × 2 窗口，步长为 2</text>

  <path d="M394 252 H481" fill="none" stroke="#64748b" stroke-width="5"/>
  <path d="M481 244 L496 252 L481 260 Z" fill="#64748b"/>
  <text x="445" y="227" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569">每一块</text>
  <text x="445" y="282" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569">变成一个数</text>

  <g filter="url(#shadow)">
    <rect x="530" y="84" width="500" height="164" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
  </g>
  <text x="560" y="117" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">最大池化 Max Pooling</text>
  <text x="560" y="145" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">保留每个窗口中的最大值</text>
    <rect x="860" y="104" width="60" height="60" fill="#bfdbfe" stroke="#ffffff" stroke-width="3"/>
    <text x="890" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">6</text>
    <rect x="920" y="104" width="60" height="60" fill="#fed7aa" stroke="#ffffff" stroke-width="3"/>
    <text x="950" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">4</text>
    <rect x="860" y="164" width="60" height="60" fill="#bbf7d0" stroke="#ffffff" stroke-width="3"/>
    <text x="890" y="202" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">7</text>
    <rect x="920" y="164" width="60" height="60" fill="#e9d5ff" stroke="#ffffff" stroke-width="3"/>
    <text x="950" y="202" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">9</text>

  <text x="920" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#334155">输出 2 × 2</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">
    <text x="590" y="190">左上：max(1, 3, 5, 6) = 6</text>
    <text x="590" y="218">右下：max(8, 3, 2, 9) = 9</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="276" width="500" height="164" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2.5"/>
  </g>
  <text x="560" y="309" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#15803d">平均池化 Average Pooling</text>
  <text x="560" y="337" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">计算每个窗口中所有数的平均值</text>
    <rect x="860" y="296" width="60" height="60" fill="#dbeafe" stroke="#ffffff" stroke-width="3"/>
    <text x="890" y="334" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">3.75</text>
    <rect x="920" y="296" width="60" height="60" fill="#ffedd5" stroke="#ffffff" stroke-width="3"/>
    <text x="950" y="334" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">2.25</text>
    <rect x="860" y="356" width="60" height="60" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/>
    <text x="890" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">3.5</text>
    <rect x="920" y="356" width="60" height="60" fill="#f3e8ff" stroke="#ffffff" stroke-width="3"/>
    <text x="950" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20.4" font-weight="700" fill="#172554">5.5</text>

  <text x="920" y="434" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#334155">输出 2 × 2</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">
    <text x="566" y="382">左上：(1 + 3 + 5 + 6) ÷ 4 = 3.75</text>
    <text x="566" y="410">右下：(8 + 3 + 2 + 9) ÷ 4 = 5.5</text>
  </g>

  <rect x="392" y="467" width="638" height="39" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="711" y="493" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#3730a3">宽度和高度减半：数据量变小，但仍保留每个局部区域的概括信息</text>
</svg>
