<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">MLP 全连接网络结构</title>
  <desc id="desc">三个输入神经元、四个隐藏神经元和两个输出神经元构成的全连接网络，相邻层两两连接。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="540" rx="18" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172033">从神经元到多层感知机（MLP）</text>

  <!-- Fully connected edges, drawn behind nodes -->
  <g stroke="#94a3b8" stroke-width="1.8" opacity="0.62" fill="none" marker-end="url(#arrow)">
    <!-- input 1 to hidden -->
    <line x1="184" y1="165" x2="435" y2="115"/><line x1="184" y1="165" x2="435" y2="215"/>
    <line x1="184" y1="165" x2="435" y2="315"/><line x1="184" y1="165" x2="435" y2="415"/>
    <!-- input 2 to hidden -->
    <line x1="184" y1="265" x2="435" y2="115"/><line x1="184" y1="265" x2="435" y2="215"/>
    <line x1="184" y1="265" x2="435" y2="315"/><line x1="184" y1="265" x2="435" y2="415"/>
    <!-- input 3 to hidden -->
    <line x1="184" y1="365" x2="435" y2="115"/><line x1="184" y1="365" x2="435" y2="215"/>
    <line x1="184" y1="365" x2="435" y2="315"/><line x1="184" y1="365" x2="435" y2="415"/>
    <!-- hidden to outputs -->
    <line x1="505" y1="115" x2="776" y2="215"/><line x1="505" y1="115" x2="776" y2="315"/>
    <line x1="505" y1="215" x2="776" y2="215"/><line x1="505" y1="215" x2="776" y2="315"/>
    <line x1="505" y1="315" x2="776" y2="215"/><line x1="505" y1="315" x2="776" y2="315"/>
    <line x1="505" y1="415" x2="776" y2="215"/><line x1="505" y1="415" x2="776" y2="315"/>
  </g>

  <!-- Layer labels -->
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">
    <text x="150" y="90">输入层 Input</text>
    <text x="470" y="75">隐藏层 Hidden</text>
    <text x="810" y="165">输出层 Output</text>
  </g>

  <!-- Input nodes -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="3">
    <circle cx="150" cy="165" r="34"/><circle cx="150" cy="265" r="34"/><circle cx="150" cy="365" r="34"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3a8a">
    <text x="150" y="173">x1</text><text x="150" y="273">x2</text><text x="150" y="373">x3</text>
  </g>

  <!-- Hidden nodes -->
  <g fill="#fef3c7" stroke="#d97706" stroke-width="3">
    <circle cx="470" cy="115" r="34"/><circle cx="470" cy="215" r="34"/>
    <circle cx="470" cy="315" r="34"/><circle cx="470" cy="415" r="34"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#92400e">
    <text x="470" y="123">h1</text><text x="470" y="223">h2</text>
    <text x="470" y="323">h3</text><text x="470" y="423">h4</text>
  </g>

  <!-- Output nodes -->
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="3">
    <circle cx="810" cy="215" r="34"/><circle cx="810" cy="315" r="34"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#166534">
    <text x="810" y="223">y1</text><text x="810" y="323">y2</text>
  </g>

  <rect x="242" y="470" width="475" height="46" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="479.5" y="500" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#475569">Each connection has a trainable weight</text>
</svg>
